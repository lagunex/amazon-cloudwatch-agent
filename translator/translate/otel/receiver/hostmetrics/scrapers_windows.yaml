cpu:
  metrics:
    system.cpu.logical.count:
      enabled: true
    system.cpu.physical.count:
      enabled: true
    # Keep per-CPU series: upstream made the cpu attribute opt-in for these metrics (v0.157.0).
    system.cpu.time:
      enabled: true
      attributes: [cpu, state]
    system.cpu.utilization:
      enabled: true
      attributes: [cpu, state]
disk:
filesystem:
  metrics:
    system.filesystem.utilization:
      enabled: true
load:
memory:
  metrics:
    system.memory.limit:
      enabled: true
    system.memory.page_size:
      enabled: true
    system.memory.utilization:
      enabled: true
network:
