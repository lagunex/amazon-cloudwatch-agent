namespace: traces.span.metrics
metrics_flush_interval: 30s
add_resource_attributes: true
dimensions:
  - name: http.response.status_code
  - name: http.request.method
  - name: http.route
  - name: http.status_code
  - name: http.method
  - name: rpc.grpc.status_code
  - name: rpc.response.status_code
  - name: error.type
# collector.instance.id became a default dimension upstream (v0.152.0). Its value is a fresh UUID on every
# agent start, so keeping it would start new series on each restart.
exclude_dimensions:
  - collector.instance.id
